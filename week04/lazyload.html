<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lazy loading example for images and iframes.">
    <title>Lazy Loading Example</title>
    <link rel="stylesheet" href="styles/lazyload.css">
    <script defer src="scripts/lazyload.js"></script>
</head>
<body>
    <main>
        <h1 class="page-title">Lazy Loading Example</h1>
        <div class="image-container">
            <img src="images/cute.jpg" alt="Cute Image" loading="lazy">
            <img src="images/fascination.jpg" alt="Another Cute Image" loading="lazy">
            <img src="images/giraffe.avif" alt="Giraffe" loading="lazy">
            <img src="images/kuala.avif" alt="Kuala Lumpur" loading="lazy">
            <img src="images/red-panda-full-body.jpg" alt="Red Panda" loading="lazy">
            <img src="images/tiger_laying.jpg" alt="Tiger Laying" loading="lazy">
        </div>
    </main>
    <footer>
        <p>©<span id="currentyear"></span> ❖ Richie Mpofu ❖ Botswana</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
