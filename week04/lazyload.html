<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lazy loading portrait images demonstration page.">
    <title>Lazy Loading Example</title>
    <link rel="stylesheet" href="styles/lazyload.css">
    <script defer src="scripts/lazyload.js"></script>
</head>
<body>
    <main>
        <h1>Lazy Loading Example</h1>
        <img src="images/cute.jpg" alt="Cute Image" width="400" height="600" loading="lazy">
        <img src="images/fascination.jpg" alt="Another Cute Image" width="400" height="600" loading="lazy">
        <img src="images/giraffe.avif" alt="Giraffe" width="400" height="600" loading="lazy">
        <img src="images/kuala.avif" alt="Kuala Lumpur" width="400" height="600" loading="lazy">
        <img src="images/red-panda-full-body.jpg" alt="Red Panda" width="400" height="600" loading="lazy">
        <img src="images/tiger_laying.jpg" alt="Tiger Laying" width="400" height="600" loading="lazy">
    </main>
    <footer>
        <p>©<span id="currentyear"></span> ❖ Richie Mpofu ❖ Bulawayo, Zimbabwe</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
