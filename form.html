<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Submit a product review with a rating, installation date, useful features, and comments.">
    <meta name="author" content="Richie Mpofu">
    <title>Product Review</title>
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script defer src="scripts/form.js"></script>
</head>
<body>
    <header>
        <p class="form-title">Product Review</p>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">
            <fieldset>
                <legend>Product Review</legend>

                <label for="productName">Product Name</label>
                <select id="productName" name="productName" required>
                    <option value="" selected disabled>Select a Product ...</option>
                </select>

                <p class="field-label">Overall Rating</p>
                <div class="rating" role="group" aria-label="Overall rating">
                    <input type="radio" id="rating1" name="rating" value="1" required>
                    <label for="rating1" title="1 star"><span aria-hidden="true">★</span><span class="sr-only">1 star</span></label>

                    <input type="radio" id="rating2" name="rating" value="2" required>
                    <label for="rating2" title="2 stars"><span aria-hidden="true">★★</span><span class="sr-only">2 stars</span></label>

                    <input type="radio" id="rating3" name="rating" value="3" required>
                    <label for="rating3" title="3 stars"><span aria-hidden="true">★★★</span><span class="sr-only">3 stars</span></label>

                    <input type="radio" id="rating4" name="rating" value="4" required>
                    <label for="rating4" title="4 stars"><span aria-hidden="true">★★★★</span><span class="sr-only">4 stars</span></label>

                    <input type="radio" id="rating5" name="rating" value="5" required>
                    <label for="rating5" title="5 stars"><span aria-hidden="true">★★★★★</span><span class="sr-only">5 stars</span></label>
                </div>

                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>

                <p class="field-label">Useful Features <span>(check all that apply)</span></p>
                <div class="features">
                    <label for="durability"><input type="checkbox" id="durability" name="features" value="Durability"> Durability</label>
                    <label for="ease"><input type="checkbox" id="ease" name="features" value="Ease of Use"> Ease of Use</label>
                    <label for="performance"><input type="checkbox" id="performance" name="features" value="Performance"> Performance</label>
                    <label for="design"><input type="checkbox" id="design" name="features" value="Design"> Design</label>
                </div>

                <label for="writtenReview">Written Review <span>(optional)</span></label>
                <textarea id="writtenReview" name="writtenReview" rows="5"></textarea>

                <label for="userName">Your Name <span>(optional)</span></label>
                <input type="text" id="userName" name="userName">

                <input type="submit" value="Post Review">
            </fieldset>
        </form>
    </main>

    <footer>
        <p>©<span id="currentyear"></span> 🏀 Richie Mpofu 🏀 Zimbabwe</p>
        <p>Last Modification: <span id="lastModified"></span></p>
    </footer>
</body>
</html>
